server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Proxy API requests to backend
    # - In local Docker: nginx proxies to backend container via service name
    # - In AWS: ALB routes /api/* to backend before reaching nginx, so this block is never hit
    # Using variable to avoid DNS resolution failure at startup if backend is not available
    location /api/ {
        resolver 127.0.0.11 valid=30s;  # Docker DNS resolver
        set $backend "chat-magic-backend:8000";
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Gracefully handle backend unavailability (for AWS where ALB handles routing)
        proxy_intercept_errors on;
        error_page 502 503 504 = @backend_unavailable;
    }

    # Fallback for when backend is unavailable (AWS scenario)
    location @backend_unavailable {
        return 200 "API routing handled by load balancer";
        add_header Content-Type text/plain;
    }

    # Angular routing - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Error pages
    error_page 404 /index.html;
}
